<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('Danh sách nhân viên')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<main class="container">
    <div th:replace="~{fragments/layout :: alerts}"></div>
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h1 class="h3 mb-0">Danh sách nhân viên</h1>
        <a sec:authorize="hasRole('ADMIN')" class="btn btn-primary" th:href="@{/employees/add}">+ Thêm nhân viên</a>
    </div>
    <div class="card">
        <div class="card-body">
            <div th:replace="~{employees/table :: table(${page.content})}"></div>
            <div class="mt-3" th:insert="~{fragments/pagination :: pager(${page}, ${pageUrl})}"></div>
        </div>
    </div>
</main>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
