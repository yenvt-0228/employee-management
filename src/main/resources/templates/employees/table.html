<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>
<div th:fragment="table(employees)" class="table-responsive">
    <table class="table table-hover mb-0">
        <thead class="table-light">
        <tr>
            <th>Mã</th>
            <th>Họ tên</th>
            <th>Email</th>
            <th>Chức vụ</th>
            <th>Phòng ban</th>
            <th>Ngày vào làm</th>
            <th sec:authorize="hasRole('ADMIN')" class="text-end">Thao tác</th>
        </tr>
        </thead>
        <tbody>
        <tr th:if="${#lists.isEmpty(employees)}">
            <td colspan="7" class="text-center text-muted py-4">Không có nhân viên nào</td>
        </tr>
        <tr th:each="e : ${employees}">
            <td><code th:text="${e.code}"></code></td>
            <td th:text="${e.name}"></td>
            <td th:text="${e.email}"></td>
            <td th:text="${e.position}"></td>
            <td><span class="badge text-bg-secondary" th:text="${e.departmentName}"></span></td>
            <td th:text="${e.hireDate != null} ? ${#temporals.format(e.hireDate, 'dd/MM/yyyy')} : ''"></td>
            <td sec:authorize="hasRole('ADMIN')" class="text-end text-nowrap">
                <a class="btn btn-sm btn-outline-primary" th:href="@{/employees/{id}/edit(id=${e.id})}">Sửa</a>
                <form th:action="@{/employees/{id}/delete(id=${e.id})}" method="post" class="d-inline"
                      th:attr="onsubmit=|return confirm('Xoá nhân viên ${e.name}?')|">
                    <button type="submit" class="btn btn-sm btn-outline-danger">Xoá</button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
