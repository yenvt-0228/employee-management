<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Đăng nhập')}"></head>
<body>
<main class="auth-wrapper px-3">
    <div class="card">
        <div class="card-body p-4">
            <h1 class="h4 mb-4 text-center">Đăng nhập</h1>
            <div th:replace="~{fragments/layout :: alerts}"></div>
            <div th:if="${param.error}" class="alert alert-danger">Sai tên đăng nhập hoặc mật khẩu</div>
            <div th:if="${param.logout}" class="alert alert-info">Bạn đã đăng xuất</div>
            <form th:action="@{/login}" method="post">
                <div class="mb-3">
                    <label for="username" class="form-label">Tên đăng nhập</label>
                    <input type="text" id="username" name="username" class="form-control" required autofocus>
                </div>
                <div class="mb-4">
                    <label for="password" class="form-label">Mật khẩu</label>
                    <input type="password" id="password" name="password" class="form-control" required>
                </div>
                <button type="submit" class="btn btn-primary w-100">Đăng nhập</button>
            </form>
            <p class="text-center mt-3 mb-0 small">
                Chưa có tài khoản? <a th:href="@{/register}">Đăng ký</a>
            </p>
        </div>
    </div>
</main>
</body>
</html>
