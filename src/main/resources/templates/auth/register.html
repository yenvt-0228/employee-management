<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Đăng ký')}"></head>
<body>
<main class="auth-wrapper px-3">
    <div class="card">
        <div class="card-body p-4">
            <h1 class="h4 mb-4 text-center">Đăng ký tài khoản</h1>
            <form th:action="@{/register}" th:object="${form}" method="post" novalidate>
                <div class="mb-3">
                    <label for="username" class="form-label">Tên đăng nhập</label>
                    <input type="text" id="username" th:field="*{username}" class="form-control" th:errorclass="is-invalid">
                    <div class="invalid-feedback" th:errors="*{username}"></div>
                </div>
                <div class="mb-3">
                    <label for="fullName" class="form-label">Họ tên</label>
                    <input type="text" id="fullName" th:field="*{fullName}" class="form-control" th:errorclass="is-invalid">
                    <div class="invalid-feedback" th:errors="*{fullName}"></div>
                </div>
                <div class="mb-3">
                    <label for="password" class="form-label">Mật khẩu</label>
                    <input type="password" id="password" th:field="*{password}" class="form-control" th:errorclass="is-invalid">
                    <div class="invalid-feedback" th:errors="*{password}"></div>
                </div>
                <div class="mb-4">
                    <label for="confirmPassword" class="form-label">Nhập lại mật khẩu</label>
                    <input type="password" id="confirmPassword" th:field="*{confirmPassword}" class="form-control" th:errorclass="is-invalid">
                    <div class="invalid-feedback" th:errors="*{confirmPassword}"></div>
                </div>
                <button type="submit" class="btn btn-primary w-100">Đăng ký</button>
            </form>
            <p class="text-center mt-3 mb-0 small">
                Đã có tài khoản? <a th:href="@{/login}">Đăng nhập</a>
            </p>
        </div>
    </div>
</main>
</body>
</html>
