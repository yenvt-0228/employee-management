<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Thống kê')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<main class="container">
    <h1 class="h3 mb-3">Thống kê nhân sự</h1>

    <div class="row g-3 mb-3">
        <div class="col-md-4">
            <div class="card"><div class="card-body">
                <div class="text-muted small">Tổng nhân viên</div>
                <div class="stat-value" th:text="${stats.totalEmployees}">0</div>
            </div></div>
        </div>
        <div class="col-md-4">
            <div class="card"><div class="card-body">
                <div class="text-muted small">Số phòng ban</div>
                <div class="stat-value" th:text="${stats.totalDepartments}">0</div>
            </div></div>
        </div>
        <div class="col-md-4">
            <div class="card"><div class="card-body">
                <div class="text-muted small">Tuyển mới 12 tháng qua</div>
                <div class="stat-value" th:text="${stats.hiredLast12Months}">0</div>
            </div></div>
        </div>
    </div>

    <div class="row g-3">
        <div class="col-lg-5">
            <div class="card h-100"><div class="card-body">
                <h2 class="h6">Nhân viên theo phòng ban</h2>
                <canvas id="byDepartmentChart" height="260"></canvas>
                <table class="table table-sm mt-3 mb-0">
                    <tr th:each="d : ${stats.byDepartment}">
                        <td th:text="${d.departmentName}"></td>
                        <td class="text-end fw-semibold" th:text="${d.employeeCount}"></td>
                        <td class="text-end text-muted" style="width: 70px"
                            th:text="${stats.totalEmployees > 0} ? ${#numbers.formatDecimal(100.0 * d.employeeCount / stats.totalEmployees, 1, 1)} + '%' : '0%'"></td>
                    </tr>
                </table>
            </div></div>
        </div>
        <div class="col-lg-7">
            <div class="card h-100"><div class="card-body">
                <h2 class="h6">Xu hướng tuyển dụng (12 tháng gần nhất)</h2>
                <canvas id="trendChart" height="260"></canvas>
            </div></div>
        </div>
    </div>
</main>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<script th:inline="javascript">
    const byDepartment = /*[[${stats.byDepartment}]]*/ [];
    const trend = /*[[${stats.hiringTrend}]]*/ [];

    new Chart(document.getElementById('byDepartmentChart'), {
        type: 'bar',
        data: {
            labels: byDepartment.map(d => d.departmentName),
            datasets: [{ label: 'Nhân viên', data: byDepartment.map(d => d.employeeCount), backgroundColor: '#0d6efd' }]
        },
        options: { indexAxis: 'y', plugins: { legend: { display: false } }, scales: { x: { beginAtZero: true, ticks: { precision: 0 } } } }
    });

    new Chart(document.getElementById('trendChart'), {
        type: 'line',
        data: {
            labels: trend.map(t => t.label),
            datasets: [{ label: 'Nhân viên mới', data: trend.map(t => t.count), borderColor: '#198754',
                backgroundColor: 'rgba(25,135,84,.1)', fill: true, tension: .3 }]
        },
        options: { plugins: { legend: { display: false } }, scales: { y: { beginAtZero: true, ticks: { precision: 0 } } } }
    });
</script>
</body>
</html>
