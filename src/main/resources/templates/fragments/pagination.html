<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<body>
<!--
  Fragment phân trang dùng chung cho mọi PageResponse.
  page    : PageResponse
  baseUrl : URL gốc (có thể đã kèm query string), fragment tự nối thêm page & size
-->
<nav th:fragment="pager(page, baseUrl)" th:if="${page.totalPages > 1}" class="d-flex justify-content-between align-items-center">
    <small class="text-muted"
           th:text="|Trang ${page.page + 1}/${page.totalPages} · ${page.totalElements} bản ghi|"></small>
    <ul class="pagination pagination-sm mb-0">
        <li class="page-item" th:classappend="${page.first} ? 'disabled'">
            <a class="page-link" th:href="@{${baseUrl}(page=${page.page - 1}, size=${page.size})}">&laquo;</a>
        </li>
        <li class="page-item" th:each="i : ${#numbers.sequence(0, page.totalPages - 1)}"
            th:classappend="${i == page.page} ? 'active'">
            <a class="page-link" th:href="@{${baseUrl}(page=${i}, size=${page.size})}" th:text="${i + 1}"></a>
        </li>
        <li class="page-item" th:classappend="${page.last} ? 'disabled'">
            <a class="page-link" th:href="@{${baseUrl}(page=${page.page + 1}, size=${page.size})}">&raquo;</a>
        </li>
    </ul>
</nav>
</body>
</html>
